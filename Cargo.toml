[package]
name = "viddupa"
version = "0.1.0"
edition = "2021"
authors = ["viddupa developers"]
description = "High-performance video duplicate detection and safe removal tool"
license = "MIT OR Apache-2.0"
repository = "https://github.com/your-org/viddupa"
keywords = ["video", "duplicate", "detection", "cli"]
categories = ["command-line-utilities", "multimedia"]

[[bin]]
name = "viddupe"
path = "src/main.rs"

[dependencies]
# CLI and argument parsing
clap = { version = "4.4", features = ["derive"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# File system operations
walkdir = "2.4"
ignore = "0.4"

# Concurrency and parallelism
rayon = "1.8"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "fs", "process", "io-util", "sync"] }
futures = "0.3"

# Progress indication
indicatif = { version = "0.17", features = ["rayon"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
rusqlite = { version = "0.30", features = ["bundled", "blob", "chrono"] }

# Hashing and image processing
img_hash = "3.2"
image = "0.23"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# Interactive UI and file operations
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
trash = "4.1"

# Utilities
once_cell = "1.19"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.10"
humansize = "2.1"
uuid = { version = "1.6", features = ["v4"] }

# Cross-platform path handling
dunce = "1.0"
